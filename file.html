<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MGRS Weather</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root{
      --bg:#0f172a;
      --card:#111827;
      --muted:#cbd5e1;
      --accent:#2563eb;
      --stat:#334155;
      --danger:#f87171;
      --radius:12px;
      color-scheme: dark;
    }
    html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,Arial,Helvetica,sans-serif;color:white}
    .container{max-width:980px;margin:16px auto;padding:12px}
    .header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    h1{font-size:20px;margin:0;font-weight:600}
    .card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .controls{display:flex;gap:10px;flex:1;min-width:220px}
    input{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;font-size:15px}
    button{padding:12px 16px;border-radius:12px;border:none;background:var(--accent);color:white;font-weight:600;cursor:pointer}
    .small{font-size:13px;color:var(--muted)}
    #map{height:420px;border-radius:12px;margin-top:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .stat{background:var(--stat);padding:10px;border-radius:10px}
    .label{font-size:11px;color:var(--muted);margin-bottom:6px}
    .value{font-size:17px;font-weight:700}
    .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .muted-pill{background:rgba(255,255,255,0.03);padding:8px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
    .error{color:var(--danger)}
    .footer{margin-top:10px;font-size:13px;color:var(--muted)}
    @media (max-width:520px){h1{font-size:18px}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MGRS Weather</h1>
      <div class="small">Enter an MGRS coordinate to view weather and location</div>
    </div>

    <div class="card" aria-live="polite">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="controls">
          <input id="mgrs" type="text" value="55KDU5000050000" aria-label="MGRS coordinate" />
          <button id="go">Get Weather</button>
        </div>
        <div style="min-width:140px;display:flex;gap:8px">
          <button id="useLocation" title="Use browser geolocation">Use my location</button>
          <button id="reset">Reset</button>
        </div>
      </div>

      <div id="output" class="card" style="margin:12px 0 0 0">
        Awaiting request.
      </div>

      <div id="map" class="card" style="padding:0;overflow:hidden">
        <!-- Leaflet map will render here -->
      </div>

      <div class="footer">Data from Open-Meteo • Map tiles by OpenStreetMap</div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mgrs@1.0.0/dist/mgrs.min.js"></script>

  <script>
    // Defaults and utilities
    const map = L.map('map', { attributionControl: true }).setView([-20, 146], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(map);
    let marker = null;

    function windDirLabel(deg){
      const names = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return names[Math.round(((deg % 360) + 360) / 22.5) % 16];
    }

    function formatISOTime(iso){
      try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
      catch { return iso; }
    }

    function showError(msg){
      document.getElementById('output').innerHTML = '<div class="error">'+msg+'</div>';
    }

    // Main fetch function
    async function getWxFromLatLon(lat, lon, mgrsInput=null){
      try{
        map.setView([lat, lon], 10);
        if(marker) marker.remove();
        marker = L.marker([lat, lon]).addTo(map);

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max,wind_direction_10m_dominant&hourly=relative_humidity_2m,cloud_cover&timezone=auto`;
        const res = await fetch(url);
        if(!res.ok) throw new Error('Network response not OK');
        const data = await res.json();

        // Defensive data extraction
        const daily = data.daily || {};
        const hourly = data.hourly || {};
        const minTemp = (daily.temperature_2m_min && daily.temperature_2m_min[0]) ?? '—';
        const maxTemp = (daily.temperature_2m_max && daily.temperature_2m_max[0]) ?? '—';
        const precip = (daily.precipitation_probability_max && daily.precipitation_probability_max[0]) ?? '—';
        const windSpeed = (daily.wind_speed_10m_max && daily.wind_speed_10m_max[0]) ?? '—';
        const windDir = (daily.wind_direction_10m_dominant && daily.wind_direction_10m_dominant[0]) ?? null;
        const sunrise = (daily.sunrise && daily.sunrise[0]) ? formatISOTime(daily.sunrise[0]) : '—';
        const sunset = (daily.sunset && daily.sunset[0]) ? formatISOTime(daily.sunset[0]) : '—';
        const maxHumidity = (hourly.relative_humidity_2m && hourly.relative_humidity_2m.length) ? Math.max(...hourly.relative_humidity_2m).toFixed(0) : '—';
        const maxCloud = (hourly.cloud_cover && hourly.cloud_cover.length) ? Math.max(...hourly.cloud_cover).toFixed(0) : '—';

        const mgrsLabel = mgrsInput ?? (typeof mgrs === 'string' ? mgrs : '');

        document.getElementById('output').innerHTML = `
          <div class="grid">
            <div class="stat"><div class="label">MIN TEMP</div><div class="value">${minTemp}°C</div></div>
            <div class="stat"><div class="label">MAX TEMP</div><div class="value">${maxTemp}°C</div></div>
            <div class="stat"><div class="label">HUMIDITY</div><div class="value">${maxHumidity}%</div></div>
            <div class="stat"><div class="label">PRECIP</div><div class="value">${precip}%</div></div>
            <div class="stat"><div class="label">CLOUD</div><div class="value">${maxCloud}%</div></div>
            <div class="stat"><div class="label">WIND</div><div class="value">${windSpeed} km/h</div></div>
          </div>
          <div class="meta">
            <div class="muted-pill"><strong>Direction:</strong> ${windDir !== null ? windDir + '° (' + windDirLabel(windDir) + ')' : '—'}</div>
            <div class="muted-pill"><strong>Sunrise:</strong> ${sunrise}</div>
            <div class="muted-pill"><strong>Sunset:</strong> ${sunset}</div>
            <div class="muted-pill"><strong>MGRS:</strong> ${mgrsLabel || '—'}</div>
            <div class="muted-pill"><strong>Lat, Lon:</strong> ${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
          </div>
        `;
        marker.bindPopup(mgrsLabel || `${lat.toFixed(5)}, ${lon.toFixed(5)}`).openPopup();
      }catch(err){
        console.error(err);
        showError('Invalid coordinate or network error.');
      }
    }

    // Button handlers
    document.getElementById('go').addEventListener('click', () => {
      const m = document.getElementById('mgrs').value.trim();
      try {
        if(!m) throw new Error('Empty');
        const p = mgrs.toPoint(m); // [lon, lat]
        const lon = Number(p[0]), lat = Number(p[1]);
        if(Number.isNaN(lat) || Number.isNaN(lon)) throw new Error('Invalid');
        getWxFromLatLon(lat, lon, m);
      } catch (e) {
        showError('Invalid MGRS coordinate.');
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      document.getElementById('mgrs').value = '55KDU5000050000';
      document.getElementById('output').textContent = 'Awaiting request.';
      map.setView([-20,146],6);
      if(marker) marker.remove();
    });

    // Use browser geolocation
    document.getElementById('useLocation').addEventListener('click', () => {
      if(!navigator.geolocation) return showError('Geolocation not supported by browser.');
      navigator.geolocation.getCurrentPosition(
        pos => getWxFromLatLon(pos.coords.latitude, pos.coords.longitude),
        err => showError('Geolocation permission denied or unavailable.')
      );
    });

    // Allow Enter key to trigger
    document.getElementById('mgrs').addEventListener('keydown', (e) => {
      if(e.key === 'Enter') document.getElementById('go').click();
    });

    // Initial example load (do not auto-run network on some embed contexts)
    // Uncomment below to auto-run on page load:
    // (function init(){ document.getElementById('go').click(); })();
  </script>
</body>
</html>
