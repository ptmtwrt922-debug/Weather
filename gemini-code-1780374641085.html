<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tactical Environmental Effects Assessment Tool (TEEA) V2.5</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root {
  --bg: #0f172a;
  --card: #111827;
  --stat: #1e293b;
  --muted: #cbd5e1;
  --accent: #3b82f6;
  --danger: #ef4444;
  --warning: #eab308;
  --success: #22c55e;
  --black: #000;
  color-scheme: dark;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  font-family: Inter, Arial, sans-serif;
  color: white;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 16px;
}

.header {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
}

.card {
  background: var(--card);
  padding: 14px;
  border-radius: 14px;
  margin-top: 12px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

input, select {
  flex: 1;
  min-width: 200px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: #1f2937;
  color: white;
  font-size: 15px;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  background: var(--accent);
  color: white;
}

button:hover {
  opacity: 0.9;
}

#map {
  height: 420px;
  border-radius: 12px;
  margin-top: 12px;
}

.section-title {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-top: 24px;
  margin-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.1);
  padding-bottom: 4px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}

.stat {
  background: var(--stat);
  padding: 12px;
  border-radius: 10px;
}

.label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 6px;
}

.value {
  font-size: 15px;
  font-weight: 700;
}

.reason-text {
  font-size: 11px;
  color: #94a3b8;
  display: block;
  margin-top: 2px;
  font-weight: 400;
}

.badge {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.bg-green { background: var(--success); color: white; }
.bg-amber { background: var(--warning); color: black; }
.bg-red { background: var(--danger); color: white; }
.bg-black { background: black; border: 1px solid rgba(255,255,255,.2); color: white;}

.assessment-box {
  padding: 14px;
  border-left: 4px solid var(--accent);
  background: rgba(59,130,246,.08);
  border-radius: 0 10px 10px 0;
  margin-bottom: 14px;
  line-height: 1.6;
}

.matrix {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.matrix td {
  padding: 8px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.matrix tr:last-child td {
  border-bottom: none;
}

.footer {
  margin-top: 12px;
  font-size: 11px;
  opacity: .5;
  text-align: center;
}

.error {
  color: #ff7a7a;
  font-weight: 700;
  padding: 20px;
}

</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>TACTICAL ENVIRONMENTAL EFFECTS ASSESSMENT (TEEA) V2.5</h1>
    <div>S2 / S3 Planning & Intelligence Support Tool</div>
  </div>

  <div class="card">
    <div class="controls">
      <input id="mgrs" value="55KDU3433326231" placeholder="Enter MGRS Grid"/>
      <select id="soilType">
        <option value="URBAN">Terrain: URBAN (Formed Roads)</option>
        <option value="SAND">Terrain: SAND (High Drainage)</option>
        <option value="LOAM" selected>Terrain: LOAM (Standard)</option>
        <option value="CLAY">Terrain: CLAY (High Retention)</option>
      </select>
      <button id="go">Analyse Objective</button>
      <button id="useLocation" style="background:#334155">Local Fix</button>
      <button id="copyReport" style="background:#334155;display:none;">Copy Report</button>
    </div>

    <div id="output" style="margin-top:16px;">
      Awaiting Grid Input...
    </div>

    <div id="map"></div>

    <div class="footer">
      Open-Meteo • Esri World Topo • MGRS.js
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.js"></script>

<script>
const map = L.map('map',{attributionControl:false}).setView([-19.33,146.57],10);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19
}).addTo(map);

let marker = null;
let windLine = null;
let smokeLine = null;
let observationRing = null;
let uasRing = null;

let currentReport = '';

function cardinal(deg) {
  const dirs = ["N","NE","E","SE","S","SW","W","NW"];
  return dirs[Math.floor(((deg+22.5)%360)/45)];
}

function assessVisibility(vis) {
  if(vis >= 10) return { status: "EXCELLENT", reason: ">=10km visibility" };
  if(vis > 5) return { status: "GOOD", reason: "5-10km visibility" };
  if(vis > 2) return { status: "DEGRADED", reason: "2-5km visibility" };
  return { status: "SEVERELY DEGRADED", reason: "<2km visibility" };
}

// ---------------- PLATFORM LOGIC (V2.5 Doctrinal Realignment) ----------------

function assessMobilityDetailed(rain5Day, soilType) {
  // Tracked Armor (M1A2 SEPv3) - Highly resilient
  let tracked = { status: "GO", reason: "Low ground pressure profile nominal." };
  if (rain5Day > 45 && (soilType === "CLAY" || soilType === "LOAM")) {
      tracked = { status: "RESTRICTED", reason: `Severe saturation (${soilType}). Hull-bottoming risk in low areas.` };
  }

  // Wheeled Protected (Bushmaster) - Susceptible to tread clogging
  let wheeled = { status: "GO", reason: "Unrestricted traction." };
  if (soilType === "CLAY" || soilType === "LOAM") {
      if (rain5Day > 35) wheeled = { status: "NO-GO", reason: `Severe liquefaction. High tread slippage restricts off-road axis.` };
      else if (rain5Day > 15) wheeled = { status: "RESTRICTED", reason: `Reduced traction. CTIS required for unsealed routes.` };
  }

  // B-Vehicles Logistics (MAN 40M / HX77) - High axle weight, primary failure point
  let bVeh = { status: "GO", reason: "Logistics routes clear." };
  if (soilType === "CLAY" || soilType === "LOAM") {
      if (rain5Day > 25) bVeh = { status: "NO-GO", reason: `Off-road supply routes unpassable. Heavy axle stalling risk.` };
      else if (rain5Day > 10) bVeh = { status: "RESTRICTED", reason: `Logistics degraded. Restrict to sealed primary routes.` };
  } else if (soilType === "SAND" && rain5Day > 60) {
       bVeh = {status: "RESTRICTED", reason: "Deep wet sand traction loss."}
  }
  
  return { tracked, wheeled, bVeh };
}

function assessAviationPlatforms(da, wind, gust, visKm) {
  const maxW = Math.max(wind, gust);
  
  // CH-47 Chinook
  let ch47 = { status: "OPTIMAL", reason: "Nominal lift margins." };
  if (da >= 6000) ch47 = { status: "DEGRADED", reason: `Severe DA (${da}ft). Heavy lift payload limits active.` };
  else if (da >= 3000) ch47 = { status: "CAUTION", reason: `Elevated DA (${da}ft). Manage payload constraints.` };
  if (maxW > 55) ch47 = { status: "NO-GO", reason: `Rotor engagement wind limit breached (>55km/h).` };

  // AH-64E Apache
  let ah64 = { status: "OPTIMAL", reason: "Nominal operational profile." };
  if (maxW > 45) ah64 = { status: "CAUTION", reason: `High gusts (${maxW}km/h). Hover/station-keeping stability disrupted.` };
  if (visKm < 3) ah64 = { status: "DEGRADED", reason: `Vis <3km. MTADS/PNVS laser & IR heavily attenuated.` };

  return { ch47, ah64 };
}

function assessISRPlatforms(wind, gust, rain) {
  const maxW = Math.max(wind, gust);
  return {
      cots: { status: maxW > 25 ? "NO-GO" : (rain > 0 ? "NO-GO" : "GO"), reason: maxW > 25 ? `Wind limit (>25km/h)` : (rain > 0 ? "Moisture vulnerability" : "Nominal") },
      blackHornet: { status: maxW > 28 ? "NO-GO" : (rain > 0 ? "NO-GO" : "GO"), reason: maxW > 28 ? `Micro-gust limit (>28km/h)` : (rain > 0 ? "Moisture vulnerability" : "Nominal") },
      skyranger: { status: maxW > 65 ? "NO-GO" : (maxW > 45 ? "RESTRICTED" : "GO"), reason: maxW > 65 ? `Absolute limit (>65km/h)` : (maxW > 45 ? "Gimbal jitter/Optics degraded" : "Nominal") },
      integrator: { status: maxW > 46 ? "NO-GO" : "GO", reason: maxW > 46 ? `L/R crosswind limit (>46km/h)` : "Nominal" },
      shadow: { status: maxW > 37 ? "NO-GO" : "GO", reason: maxW > 37 ? `L/R crosswind limit (>37km/h)` : "Nominal" }
  };
}

function assessLightning(cape) {
  if(cape > 2500) return { status: "HIGH", reason: `Extreme Instability (CAPE ${Math.round(cape)})` };
  if(cape > 1000) return { status: "MODERATE", reason: `Moderate Instability (CAPE ${Math.round(cape)})` };
  return { status: "LOW", reason: "Stable Atmosphere" };
}

function assessSmoke(wind) {
  if(wind < 5) return { status: "POOR", reason: "Stagnant winds (<5km/h)" };
  if(wind > 25) return { status: "POOR", reason: "High winds (>25km/h)" };
  return { status: "EFFECTIVE", reason: "Optimal dispersion winds" };
}

function assessAcoustics(cloudCover, windSpeed, isNight) {
  if (isNight && cloudCover < 30 && windSpeed < 10) {
    return { status: "EXTREME", reason: "Atmospheric Inversion Likely. Signatures travel further." };
  } else if (windSpeed > 25) {
    return { status: "MASKED", reason: "High ambient wind noise will dissipate signatures." };
  }
  return { status: "NORMAL", reason: "Standard acoustic attenuation." };
}

function calculateThermalDegradation(rh, rain, currentTime, sunrise, sunset) {
  let effectiveness = 100;
  let degradationReasons = [];

  if (rh > 75) {
    const rhPenalty = Math.round((rh - 75) * 1.5);
    effectiveness -= rhPenalty;
    degradationReasons.push(`High RH atmospheric attenuation`);
  }

  if (rain > 0) {
    let rainPenalty = rain > 5 ? 40 : Math.round(rain * 8); 
    effectiveness -= rainPenalty;
    degradationReasons.push(`Precipitation washout effects`);
  }

  const sunriseTime = new Date(sunrise).getTime();
  const sunsetTime = new Date(sunset).getTime();
  
  const hoursToSunrise = Math.abs(currentTime - sunriseTime) / 3600000;
  const hoursToSunset = Math.abs(currentTime - sunsetTime) / 3600000;
  
  if (hoursToSunrise < 1.5 || hoursToSunset < 1.5) {
    effectiveness -= 30;
    degradationReasons.push("Thermal crossover conditions");
  }

  effectiveness = Math.max(15, effectiveness);

  let status = "OPTIMAL";
  if (effectiveness < 80) status = "DEGRADED";
  if (effectiveness < 50) status = "SEVERELY DEGRADED";

  return {
    percentage: Math.round(effectiveness),
    status: status,
    reason: degradationReasons.join(" | ") || "Clear Thermal Contrast"
  };
}

function mapSensorDegradationWindows(hourly, currentIndex, sunrise, sunset) {
  let redZones = [];
  
  for (let i = currentIndex; i < currentIndex + 24; i++) {
    if(i >= hourly.time.length) break;
    
    let rh = hourly.relative_humidity_2m[i];
    let rain = hourly.precipitation[i] || 0;
    let time = new Date(hourly.time[i]).getTime();
    
    let thermalObj = calculateThermalDegradation(rh, rain, time, sunrise, sunset);
    let effectiveness = thermalObj.percentage;
    
    if (effectiveness < 60) {
      let d = new Date(time);
      let hourString = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      let dayName = d.toLocaleDateString([], { weekday: 'short' });
      redZones.push(`${dayName} ${hourString} (${thermalObj.status})`);
    }
  }

  if (redZones.length === 0) return "No significant degradation windows in the next 24hrs.";
  return redZones.join(", ");
}

function densityAltitude(elevation, temp, pressure) {
  const elevFt = elevation * 3.28084;
  const pressureAlt = ((1013.25 - pressure) * 27) + elevFt;
  const isa = 15 - ((pressureAlt / 1000) * 1.98);
  return Math.round(pressureAlt + 118.8 * (temp - isa));
}

function moonIllumination() {
  const synodic = 29.53058867;
  const diff = (Date.now() - new Date("2000-01-06T18:14:00Z")) / 86400000;
  const phase = (diff / synodic) % 1;
  return Math.round(0.5 * (1 - Math.cos(phase * 2 * Math.PI)) * 100);
}

function assessNVG(cloud, moon) {
  if(cloud > 75) return { status: "POOR", reason: `High Cloud Cover (${Math.round(cloud)}%)` };
  if(moon < 25) return { status: "MARGINAL", reason: `Low Illumination (${moon}%)` };
  return { status: "OPTIMAL", reason: `Good Illumination (${moon}%)` };
}

function forecastTrend(forecast) {
  const worsening = forecast.some(x => x.mobility.bVeh.status !== "GO" || x.uas.skyranger.status !== "GO");
  return worsening ? "DETERIORATING" : "STABLE";
}

function identifyBestWindow(forecast) {
  let best = forecast[0];
  forecast.forEach(day => {
    if(day.mobility.bVeh.status === "GO" && day.uas.skyranger.status === "GO") {
      best = day;
    }
  });
  return `D+${best.day}`;
}

function calculateBMNT(sunrise) {
  const d = new Date(sunrise);
  d.setMinutes(d.getMinutes() - 30);
  return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
}

function calculateEENT(sunset) {
  const d = new Date(sunset);
  d.setMinutes(d.getMinutes() + 30);
  return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
}

function build72HrForecast(daily, soilType) {
  let outlook = [];
  for(let d=0; d<4; d++){
    const rain = daily.precipitation_sum[d] || 0;
    const wind = daily.wind_speed_10m_max[d] || 0;
    const gust = daily.wind_gusts_10m_max[d] || 0;
    
    let mobility = assessMobilityDetailed(rain, soilType);
    let uas = assessISRPlatforms(wind, gust, rain);
    
    outlook.push({ day: d, rain, wind, gust, mobility, uas });
  }
  return outlook;
}

function generateCurrentCommanderAssessment(data) {
  let friction = "MINIMAL";
  if(data.mobility.wheeled.status === "RESTRICTED" || data.isr.skyranger.status === "RESTRICTED") friction = "MODERATE";
  if(data.mobility.bVeh.status === "NO-GO" || data.aviation.ch47.status === "NO-GO") friction = "SEVERE";
  
  return `<strong>OVERALL OPERATIONAL FRICTION: ${friction}</strong><br><br>
  <strong>MANOEUVRE:</strong> Wheeled combat mobility (Bushmaster) is assessed as <strong>${data.mobility.wheeled.status}</strong> (${data.mobility.wheeled.reason}). Logistics (B-Vehicles) are <strong>${data.mobility.bVeh.status}</strong>. Tracked elements (M1A2) remain <strong>${data.mobility.tracked.status}</strong>.<br>
  <strong>AVIATION:</strong> CH-47 operations are <strong>${data.aviation.ch47.status}</strong> (${data.aviation.ch47.reason.toLowerCase()}). AH-64E employment is <strong>${data.aviation.ah64.status}</strong>. LWIR Thermal capabilities are currently <strong>${data.thermal.status}</strong>.<br>
  <strong>FIRES & EFFECTS:</strong> Atmospheric conditions for deliberate smoke screening are <strong>${data.smoke.status}</strong> (${data.smoke.reason.toLowerCase()}). Artillery support is <strong>${data.fireSupport.artillery}</strong>.`;
}

function generate72HourCommanderAssessment(forecast) {
  let poorDays = forecast.filter(x => x.mobility.bVeh.status !== "GO" || x.uas.skyranger.status !== "GO");
  
  if(poorDays.length === 0) {
    return `<strong>OUTLOOK: STABLE</strong><br><br>Environmental conditions remain optimal across the 72-hour forecast period. No significant weather-induced constraints on operational tempo, B-vehicle logistics, or tactical UAS deployment are anticipated. Commanders should exploit this window for complex or aviation-dependent operations.`;
  } else if (poorDays.length <= 2) {
    return `<strong>OUTLOOK: MARGINAL / DETERIORATING</strong><br><br>Intermittent environmental degradation is forecast. Specific windows (starting around D+${poorDays[0].day}) will see restricted operations primarily impacting unsealed logistics lines or tactical UAS arrays. Commanders should sequence critical aviation and off-road resupply phases to avoid these degraded periods.`;
  } else {
    return `<strong>OUTLOOK: SEVERELY DEGRADED</strong><br><br>Persistent adverse weather is forecast across the 72-hour period. Sustained impacts on B-vehicle ground mobility and aerial platforms are highly likely. Scheme of manoeuvre should heavily rely on hardened routes. Anticipate delays in medical evacuation (CASEVAC/MEDEVAC) and aerial resupply.`;
  }
}

function generateIntelligenceAssessmentV2(data) {
  let points = [];
  if(data.mobility.wheeled.status === "GO") points.push("Weather presents no asymmetric advantage regarding manoeuvre; both friendly and threat forces maintain unrestricted mobility.");
  if(data.mobility.bVeh.status === "RESTRICTED" || data.mobility.bVeh.status === "NO-GO") points.push("Terrain saturation will likely channel threat vehicle movement and logistics onto established, formed routes, increasing predictability for friendly Target Areas of Interest (TAIs).");
  if(data.visibility.status === "SEVERELY DEGRADED" || data.thermal.status === "SEVERELY DEGRADED") points.push("Reduced visibility/thermal contrast provides a significant advantage for threat infiltration and concealment, degrading friendly standoff observation capabilities.");
  if(data.isr.skyranger.status === "RESTRICTED" || data.isr.skyranger.status === "NO-GO") points.push(`Threat tactical UAS employment will be degraded due to current wind/precipitation constraints, reducing enemy early warning capabilities.`);
  if(data.smoke.status === "EFFECTIVE") points.push("Atmospheric conditions heavily favour both friendly and threat deliberate obscuration (smoke) operations.");
  if(data.acoustics.status === "EXTREME") points.push("Acoustic inversions are likely; threat mechanical movements and breach signatures will travel significantly further, enhancing friendly early warning.");
  
  if(points.length === 0) points.push("No significant weather-derived asymmetric advantage or disadvantage is currently identified.");
  
  return points.join(" ");
}

function styleBadge(status) {
    let css = "bg-green";
    if (status === "RESTRICTED" || status === "DEGRADED" || status === "MODERATE" || status === "CAUTION" || status === "POOR" || status === "MARGINAL") css = "bg-amber";
    if (status === "NO-GO" || status === "SEVERE" || status === "SEVERELY DEGRADED" || status === "EXTREME" || status === "HIGH") css = "bg-red";
    return `<span class="badge ${css}">${status}</span>`;
}

function buildFriendlyEffects(data) {
  return [
    ["Tracked Armor (M1A2 SEPv3)", `${styleBadge(data.mobility.tracked.status)} <span class="reason-text">(${data.mobility.tracked.reason})</span>`],
    ["Wheeled Protected (Bushmaster)", `${styleBadge(data.mobility.wheeled.status)} <span class="reason-text">(${data.mobility.wheeled.reason})</span>`],
    ["B-Vehicles (MAN 40M / HX77)", `${styleBadge(data.mobility.bVeh.status)} <span class="reason-text">(${data.mobility.bVeh.reason})</span>`],
    ["CH-47 Chinook", `${styleBadge(data.aviation.ch47.status)} <span class="reason-text">(${data.aviation.ch47.reason})</span>`],
    ["AH-64E Apache", `${styleBadge(data.aviation.ah64.status)} <span class="reason-text">(${data.aviation.ah64.reason})</span>`],
    ["Commercial COTS UAS", `${styleBadge(data.isr.cots.status)} <span class="reason-text">(${data.isr.cots.reason})</span>`],
    ["Black Hornet 3", `${styleBadge(data.isr.blackHornet.status)} <span class="reason-text">(${data.isr.blackHornet.reason})</span>`],
    ["R70 Skyranger", `${styleBadge(data.isr.skyranger.status)} <span class="reason-text">(${data.isr.skyranger.reason})</span>`],
    ["Insitu Integrator", `${styleBadge(data.isr.integrator.status)} <span class="reason-text">(${data.isr.integrator.reason})</span>`],
    ["RQ-7B Shadow 200", `${styleBadge(data.isr.shadow.status)} <span class="reason-text">(${data.isr.shadow.reason})</span>`],
    ["Ground Obs (Visual)", `${styleBadge(data.visibility.status)} <span class="reason-text">(${data.visibility.reason})</span>`],
    ["Ground Obs (Thermal)", `${styleBadge(data.thermal.status)} <span class="reason-text">(${data.thermal.reason})</span>`],
    ["Acoustic Concealment", `${styleBadge(data.acoustics.status)} <span class="reason-text">(${data.acoustics.reason})</span>`],
    ["Smoke Employment", `${styleBadge(data.smoke.status)} <span class="reason-text">(${data.smoke.reason})</span>`],
    ["Fire Support", `Arty: ${styleBadge(data.fireSupport.artillery)} | Mortars: ${styleBadge(data.fireSupport.mortars)}`]
  ];
}

function buildEnemyEffects(data) {
  return [
    ["Olvanan Amphibious Vanguard (ZBD-05 / ZTD-05)", `${styleBadge(data.mobility.tracked.status)} <span class="reason-text">(Tracked amphibious armor: ${data.mobility.tracked.reason})</span>`],
    ["Olvanan Light Armor (ZTQ-15)", `${styleBadge(data.mobility.tracked.status)} <span class="reason-text">(Tracked platform: ${data.mobility.tracked.reason})</span>`],
    ["Olvanan Wheeled Logistics (EQ2050 / CTM131)", `${styleBadge(data.mobility.bVeh.status)} <span class="reason-text">(Wheeled supply pipeline: ${data.mobility.bVeh.reason})</span>`],
    ["Enemy COTS UAS Employment", `${styleBadge(data.isr.cots.status)} <span class="reason-text">(${data.isr.cots.reason})</span>`],
    ["Enemy Obs (Visual)", `${styleBadge(data.visibility.status)} <span class="reason-text">(${data.visibility.reason})</span>`],
    ["Enemy Obs (Thermal)", `${styleBadge(data.thermal.status)} <span class="reason-text">(${data.thermal.reason})</span>`],
    ["Enemy Smoke Employment", `${styleBadge(data.smoke.status)} <span class="reason-text">(${data.smoke.reason})</span>`],
    ["Enemy Fire Support", `Arty: ${styleBadge(data.fireSupport.artillery)} | Mortars: ${styleBadge(data.fireSupport.mortars)}`]
  ];
}

function assessFireSupportV2(wind, rain, visibilityStatus) {
  let artillery = "OPTIMAL";
  let mortars = "OPTIMAL";
  let smoke = "OPTIMAL";
  
  if(wind > 25) { artillery = "RESTRICTED"; smoke = "DEGRADED"; }
  if(rain > 15) { artillery = "DEGRADED"; mortars = "DEGRADED"; }
  if(visibilityStatus === "SEVERELY DEGRADED") { artillery = "DEGRADED"; }
  
  return { artillery, mortars, smoke };
}

function renderMatrix(title, rows) {
  let html = `<div class="section-title">${title}</div><table class="matrix">`;
  rows.forEach(r => { html += `<tr><td style="width: 40%; font-size: 13px;">${r[0]}</td><td>${r[1]}</td></tr>`; });
  html += `</table>`;
  return html;
}

function drawWindArrow(lat, lon, direction, speed) {
  if(windLine) map.removeLayer(windLine);
  const len = 0.02 + (speed / 1000);
  const endLat = lat + (len * Math.cos((direction - 90) * Math.PI / 180));
  const endLon = lon + (len * Math.sin((direction - 90) * Math.PI / 180));
  windLine = L.polyline([[lat, lon], [endLat, endLon]], { weight: 4 }).addTo(map);
}

function drawSmokeCone(lat, lon, direction) {
  if(smokeLine) map.removeLayer(smokeLine);
  const len = 0.015;
  const endLat = lat + (len * Math.cos((direction - 90) * Math.PI / 180));
  const endLon = lon + (len * Math.sin((direction - 90) * Math.PI / 180));
  smokeLine = L.polyline([[lat, lon], [endLat, endLon]], { dashArray: "8,8", weight: 3, color: "gray" }).addTo(map);
}

function drawObservationRing(lat, lon, visibilityKm) {
  if(observationRing) map.removeLayer(observationRing);
  observationRing = L.circle([lat, lon], { radius: Math.max(2000, visibilityKm * 1000), fill: false, color: "#3b82f6" }).addTo(map);
}

function drawUASRing(lat, lon) {
  if(uasRing) map.removeLayer(uasRing);
  uasRing = L.circle([lat, lon], { radius: 5000, fill: false, color: "#eab308", dashArray: "5,5" }).addTo(map);
}

async function getWxFromLatLon(lat, lon, mgrsLabel="") {
  try {
    document.getElementById("copyReport").style.display = "none";
    document.getElementById("output").innerHTML = `<div style="padding:20px;text-align:center;">Compiling Environmental Effects Assessment...</div>`;
    
    map.setView([lat, lon], 12);
    
    if(marker) map.removeLayer(marker);
    if(windLine) map.removeLayer(windLine);
    if(smokeLine) map.removeLayer(smokeLine);
    if(observationRing) map.removeLayer(observationRing);
    if(uasRing) map.removeLayer(uasRing);
    
    marker = L.marker([lat, lon]).addTo(map);

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&forecast_days=4&past_days=5&timezone=auto&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset&hourly=visibility,cloud_cover,relative_humidity_2m,surface_pressure,cape,precipitation`.replace(/\s+/g, '');
    
    const response = await fetch(url);
    if(!response.ok) throw new Error("API");
    const wx = await response.json();
    
    const daily = wx.daily;
    const hourly = wx.hourly;
    const elevation = wx.elevation || 0;
    const soilType = document.getElementById("soilType").value;
    
    let rain5Day = 0;
    const todayStr = new Date().toISOString().split('T')[0];
    let todayIdx = daily.time.findIndex(t => t === todayStr) || 0;
    if(todayIdx === -1) todayIdx = 5; 
    
    for(let i=0; i<=todayIdx; i++) { if(daily.precipitation_sum[i]) rain5Day += daily.precipitation_sum[i]; }
    
    const tempMax = daily.temperature_2m_max[todayIdx];
    const tempMin = daily.temperature_2m_min[todayIdx];
    const rainToday = daily.precipitation_sum[todayIdx];
    const wind = daily.wind_speed_10m_max[todayIdx];
    const gust = daily.wind_gusts_10m_max[todayIdx];
    const windDir = daily.wind_direction_10m_dominant[todayIdx];
    const windCard = cardinal(windDir);
    
    const nowTime = Date.now();
    let currentHourIdx = 0;
    for(let i=0; i<hourly.time.length; i++) {
        if(new Date(hourly.time[i]).getTime() > nowTime) {
            currentHourIdx = Math.max(0, i-1);
            break;
        }
    }
    
    const hStart = currentHourIdx;
    const hEnd = Math.min(hourly.time.length, currentHourIdx + 24);
    
    const visibilitySlice = hourly.visibility.slice(hStart, hEnd).filter(x => x !== null);
    const visibilityKm = visibilitySlice.length > 0 ? Math.min(...visibilitySlice, 10000) / 1000 : 10;
    const visibility = assessVisibility(visibilityKm);
    
    const cloudSlice = hourly.cloud_cover.slice(hStart, hEnd);
    const cloudAvg = cloudSlice.length > 0 ? (cloudSlice.reduce((a, b) => a + b, 0) / cloudSlice.length) : 0;
    
    const rhCurrent = hourly.relative_humidity_2m[currentHourIdx] || 50;
    
    const pressureSlice = hourly.surface_pressure.slice(hStart, hEnd);
    const pressure = pressureSlice.length > 0 ? (pressureSlice.reduce((a, b) => a + b, 0) / pressureSlice.length) : 1013;
    
    const capeMax = Math.max(...hourly.cape.slice(hStart, hEnd));
    const da = densityAltitude(elevation, tempMax, pressure);
    
    const todaySunriseStr = daily.sunrise[todayIdx];
    const todaySunsetStr = daily.sunset[todayIdx];
    
    const mobility = assessMobilityDetailed(rain5Day, soilType);
    const aviation = assessAviationPlatforms(da, wind, gust, visibilityKm);
    const isr = assessISRPlatforms(wind, gust, rainToday);
    const lightning = assessLightning(capeMax);
    const smoke = assessSmoke(wind);
    const fireSupport = assessFireSupportV2(wind, rainToday, visibility.status);
    const acoustics = assessAcoustics(cloudAvg, wind, nowTime < new Date(todaySunriseStr).getTime() || nowTime > new Date(todaySunsetStr).getTime());
    
    const thermal = calculateThermalDegradation(rhCurrent, hourly.precipitation[currentHourIdx] || 0, nowTime, todaySunriseStr, todaySunsetStr);
    const thermalTimeline = mapSensorDegradationWindows(hourly, currentHourIdx, todaySunriseStr, todaySunsetStr);
    
    const moon = moonIllumination();
    const nvg = assessNVG(cloudAvg, moon);
    
    const futureDaily = {
      day: daily.time.slice(todayIdx, todayIdx+4),
      precipitation_sum: daily.precipitation_sum.slice(todayIdx, todayIdx+4),
      wind_speed_10m_max: daily.wind_speed_10m_max.slice(todayIdx, todayIdx+4),
      wind_gusts_10m_max: daily.wind_gusts_10m_max.slice(todayIdx, todayIdx+4),
    };
    const forecast = build72HrForecast(futureDaily, soilType);
    
    const assessmentData = {
      mobility, aviation, isr, visibility, smoke, lightning, fireSupport, thermal, acoustics
    };
    
    const commanderNow = generateCurrentCommanderAssessment(assessmentData);
    const commander72 = generate72HourCommanderAssessment(forecast);
    const intelligence = generateIntelligenceAssessmentV2(assessmentData);
    const trend = forecastTrend(forecast);
    const bestWindow = identifyBestWindow(forecast);
    
    drawWindArrow(lat, lon, windDir, wind);
    drawSmokeCone(lat, lon, windDir); 
    drawObservationRing(lat, lon, visibilityKm);
    drawUASRing(lat, lon);
    
    let forecastHtml = `<div class="section-title">72 HOUR OUTLOOK</div><div class="grid">`;
    forecast.forEach(day => {
      let overallMob = day.mobility.bVeh.status === "NO-GO" ? "NO-GO" : (day.mobility.wheeled.status === "RESTRICTED" ? "RESTRICTED" : "GO");
      let overallUAS = day.uas.skyranger.status === "NO-GO" ? "NO-GO" : (day.uas.skyranger.status === "RESTRICTED" ? "RESTRICTED" : "GO");

      forecastHtml += `
        <div class="stat">
          <div class="label">D+${day.day}</div>
          <div>Rain: ${day.rain.toFixed(1)} mm</div>
          <div>Wind: ${day.wind} km/h</div>
          <div style="margin-top:6px;">Logistics: ${styleBadge(overallMob)}</div>
          <div style="margin-top:4px;">Tac-UAS: ${styleBadge(overallUAS)}</div>
        </div>
      `;
    });
    forecastHtml += `</div>`;
    
    const friendlyMatrix = renderMatrix("FRIENDLY EFFECTS MATRIX", buildFriendlyEffects(assessmentData));
    const enemyMatrix = renderMatrix("ENEMY EFFECTS MATRIX", buildEnemyEffects(assessmentData));
    
    document.getElementById("output").innerHTML = `
      <div class="assessment-box"><strong>COMMANDER'S ASSESSMENT (CURRENT)</strong><br><br>${commanderNow}</div>
      <div class="assessment-box"><strong>COMMANDER'S ASSESSMENT (72 HOUR OUTLOOK)</strong><br><br>${commander72}</div>
      <div class="assessment-box"><strong>INTELLIGENCE ASSESSMENT</strong><br><br>${intelligence}</div>
      
      <div class="section-title">ENVIRONMENTAL CONDITIONS</div>
      <div class="grid">
        <div class="stat"><div class="label">TEMPERATURE</div><div class="value">${tempMin}°C / ${tempMax}°C</div></div>
        <div class="stat"><div class="label">WIND</div><div class="value">${wind} km/h ${windCard}</div></div>
        <div class="stat"><div class="label">GUSTS</div><div class="value">${gust} km/h</div></div>
        <div class="stat"><div class="label">VISIBILITY</div><div class="value">${visibilityKm.toFixed(1)} km</div><span class="reason-text">${visibility.reason}</span></div>
        <div class="stat"><div class="label">CLOUD COVER</div><div class="value">${cloudAvg.toFixed(0)}%</div></div>
        <div class="stat"><div class="label">CURRENT RH</div><div class="value">${rhCurrent}%</div></div>
        <div class="stat"><div class="label">ACCUM. PRECIP</div><div class="value">${rain5Day.toFixed(1)} mm</div><span class="reason-text">${soilType} Surface</span></div>
        <div class="stat"><div class="label">DENSITY ALTITUDE</div><div class="value">${da} ft</div></div>
        
        <div class="stat"><div class="label">MOON ILLUMINATION</div><div class="value">${moon}%</div></div>
        <div class="stat"><div class="label">BMNT</div><div class="value">${calculateBMNT(todaySunriseStr)}</div></div>
        <div class="stat"><div class="label">EENT</div><div class="value">${calculateEENT(todaySunsetStr)}</div></div>
      </div>
      
      ${forecastHtml}
      
      <div class="section-title">SENSOR & ACOUSTIC TIMELINE</div>
      <div class="grid">
        <div class="stat"><div class="label">LWIR THERMAL DEGRADATION WINDOWS (NEXT 24H)</div><div class="value" style="font-size:12px; font-weight: 400;">${thermalTimeline}</div></div>
      </div>
      
      <div class="section-title">OPERATIONAL OUTLOOK</div>
      <div class="grid">
        <div class="stat"><div class="label">72HR TREND</div><div class="value">${trend}</div></div>
        <div class="stat"><div class="label">BEST WEATHER WINDOW</div><div class="value">${bestWindow}</div></div>
        <div class="stat"><div class="label">NVG CONDITIONS</div><div class="value">${nvg.status}</div><span class="reason-text">${nvg.reason}</span></div>
        <div class="stat"><div class="label">ACOUSTICS</div><div class="value">${acoustics.status}</div><span class="reason-text">${acoustics.reason}</span></div>
      </div>
      
      ${friendlyMatrix}
      ${enemyMatrix}
    `;
    
    currentReport = `
TACTICAL ENVIRONMENTAL EFFECTS ASSESSMENT
GRID: ${mgrsLabel}
TERRAIN: ${soilType}

CURRENT COMMANDER'S ASSESSMENT
${commanderNow.replace(/<[^>]+>/g, '')}

72 HOUR OUTLOOK
${commander72.replace(/<[^>]+>/g, '')}

INTELLIGENCE ASSESSMENT
${intelligence.replace(/<[^>]+>/g, '')}

CURRENT CONDITIONS
Temperature: ${tempMin}-${tempMax}C
Wind: ${wind} km/h (${windCard})
Visibility: ${visibilityKm.toFixed(1)} km
Thermal Effectiveness: ${thermal.status} (${thermal.reason})
Acoustic Status: ${acoustics.status} (${acoustics.reason})

ANTICIPATED THERMAL DEGRADATION WINDOWS (NEXT 24H)
${thermalTimeline}

EFFECTS SUMMARY
Tracked Mobility: ${mobility.tracked.status} (${mobility.tracked.reason})
Wheeled Mobility: ${mobility.wheeled.status} (${mobility.wheeled.reason})
B-Vehicle Logistics: ${mobility.bVeh.status} (${mobility.bVeh.reason})
Tac-UAS (Skyranger): ${isr.skyranger.status} (${isr.skyranger.reason})
Rotary Wing (CH47): ${aviation.ch47.status} (${aviation.ch47.reason})
Fire Support: 
- Arty: ${fireSupport.artillery}
- Mortars: ${fireSupport.mortars}
- Smoke: ${fireSupport.smoke}
Lightning Risk: ${lightning.status}
NVG Conditions: ${nvg.status} (${nvg.reason})

THREAT PLATFORM MOBILITY SUMMARY (OLVANAN MARINE BRIGADE)
ZBD-05 / ZTD-05 Amphibious Armor Mobility: ${mobility.tracked.status}
ZTQ-15 Light Tank Mobility: ${mobility.tracked.status}
EQ2050 / CTM131 Logistics Pipeline Mobility: ${mobility.bVeh.status}
`;
    
    document.getElementById("copyReport").style.display = "inline-block";
    marker.bindPopup(mgrsLabel || "Objective");
    
  } catch(err) {
    console.error(err);
    document.getElementById("output").innerHTML = `<div class="error">Unable to retrieve environmental data. Ensure you have an active network connection.</div>`;
  }
}

document.getElementById("go").addEventListener("click", () => {
  try {
    const grid = document.getElementById("mgrs").value.replace(/\s+/g, '').toUpperCase();
    const coords = window.mgrs.toPoint(grid);
    getWxFromLatLon(coords[1], coords[0], grid);
  } catch {
    document.getElementById("output").innerHTML = `<div class="error">Invalid MGRS coordinate. Ensure correct format (e.g., 55KDU3433326231).</div>`;
  }
});

document.getElementById("useLocation").addEventListener("click", () => {
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      let grid = "LOCAL FIX";
      try { grid = window.mgrs.forward([lon, lat]); } catch(e) {}
      document.getElementById("mgrs").value = grid;
      getWxFromLatLon(lat, lon, grid);
    },
    () => { alert("Location access denied."); }
  );
});

document.getElementById("mgrs").addEventListener("keydown", e => {
  if(e.key === "Enter") document.getElementById("go").click();
});

document.getElementById("copyReport").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(currentReport);
    const btn = document.getElementById("copyReport");
    btn.innerText = "COPIED";
    setTimeout(() => { btn.innerText = "Copy Report"; }, 2000);
  } catch(err) {
    console.error(err);
  }
});

</script>
